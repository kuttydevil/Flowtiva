    <style>
      :root {
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
        --muted: 210 40% 96.1%;
        --muted-foreground: 215.4 16.3% 46.9%;
        --card: 0 0% 100%;
        --card-foreground: 222.2 84% 4.9%;
        --popover: 0 0% 100%;
        --popover-foreground: 222.2 84% 4.9%;
        --primary: 172 100% 27%; /* Teal-700 */
        --primary-foreground: 210 40% 98%;
        --secondary: 210 40% 96.1%;
        --secondary-foreground: 222.2 47.4% 11.2%;
        --accent: 173 100% 34%; /* Teal-600 */
        --accent-foreground: 210 40% 98%;
        --destructive: 0 84.2% 60.2%;
        --destructive-foreground: 210 40% 98%;
        --border: 214.3 31.8% 91.4%;
        --input: 214.3 31.8% 91.4%;
        --ring: 173 100% 34%;
        --radius: 0.75rem;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 8px -2px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.04);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.05);
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        --instagram-gradient: linear-gradient(to right, #833ab4, #fd1d1d, #fcb045);
        /* WhatsApp Colors - Light Mode */
        --wa-bg: #E5DDD5;
        --wa-message-out-bg: #DCF8C6;
        --wa-message-in-bg: #FFFFFF;
        --wa-panel-header-bg: #F0F2F5;
        --wa-app-bg: #F0F2F5;
        --wa-text-secondary: #667781;
        --wa-icon: #54656f;
        --wa-read-receipt: #53bdeb;
      }
 
      .dark {
        --background: 222.2 84% 4.9%;
        --foreground: 210 40% 98%;
        --muted: 217.2 32.6% 17.5%;
        --muted-foreground: 215 20.2% 65.1%;
        --card: 222.2 84% 4.9%;
        --card-foreground: 210 40% 98%;
        --popover: 222.2 84% 4.9%;
        --popover-foreground: 210 40% 98%;
        --primary: 173 100% 39%; /* Lighter Teal */
        --primary-foreground: 222.2 47.4% 11.2%;
        --secondary: 217.2 32.6% 17.5%;
        --secondary-foreground: 210 40% 98%;
        --accent: 173 100% 39%;
        --accent-foreground: 210 40% 98%;
        --destructive: 0 62.8% 30.6%;
        --destructive-foreground: 210 40% 98%;
        --border: 217.2 32.6% 17.5%;
        --input: 217.2 32.6% 17.5%;
        --ring: 173 100% 39%;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.15);
        --shadow-md: 0 4px 8px -2px rgb(0 0 0 / 0.2), 0 2px 4px -2px rgb(0 0 0 / 0.2);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.2), 0 4px 6px -4px rgb(0 0 0 / 0.2);
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.2), 0 8px 10px -6px rgb(0 0 0 / 0.2);
        /* WhatsApp Colors - Dark Mode */
        --wa-bg: #0b141a;
        --wa-message-out-bg: #005c4b;
        --wa-message-in-bg: #202c33;
        --wa-panel-header-bg: #202c33;
        --wa-app-bg: #111b21;
        --wa-text-secondary: #8696a0;
        --wa-icon: #aebac1;
        --wa-read-receipt: #53bdeb;
      }
      
      *, ::before, ::after {
          border-color: hsl(var(--border));
          transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
          transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
          transition-duration: 200ms;
      }
      body {
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: 'Inter', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html[lang="ar"] body {
        font-family: 'Tajawal', sans-serif;
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: hsl(var(--border) / 0.5); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: hsl(var(--muted-foreground)); }
      
      /* New Animations */
      @keyframes animate-in {
        from { opacity: 0; transform: translateY(-8px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .animate-in { animation: animate-in 0.3s ease-out forwards; }
      .scroll-target { opacity: 0; }
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up { animation: fade-in-up 0.6s cubic-bezier(0.215, 0.61, 0.355, 1) forwards; }
      
      /* Completion animation with checkmark flourish */
      @keyframes complete-flash-bg {
        0% { background-color: hsl(var(--card)); }
        40% { background-color: hsla(var(--primary), 0.1); }
        100% { background-color: hsl(var(--card)); }
      }
      @keyframes complete-checkmark-flourish {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5) rotate(-30deg); }
        25%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(5deg); }
        40%  { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        85%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      }
      .animate-complete-flash {
        position: relative;
        overflow: hidden;
        animation: complete-flash-bg 1.4s ease-in-out;
      }
      .animate-complete-flash::after {
        content: ''; position: absolute; top: 50%; left: 50%; width: 48px; height: 48px;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke-width='3' stroke='white'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' d='m4.5 12.75 6 6 9-13.5' /%3e%3c/svg%3e");
        background-size: 50%; background-position: center; background-repeat: no-repeat;
        border-radius: 50%; background-color: hsla(var(--primary), 0.85);
        transform: translate(-50%, -50%) scale(0); opacity: 0;
        animation: complete-checkmark-flourish 1.0s ease-out 0.1s both; z-index: 10;
      }
      
      /* Accordion */
      .faq-answer {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .faq-answer.open {
        grid-template-rows: 1fr;
      }
      .faq-answer > div {
        overflow: hidden;
      }
      /* New animation for the content inside */
      .faq-answer > div > p {
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.3s ease-out, transform 0.3s ease-out;
      }
      .faq-answer.open > div > p {
        opacity: 1;
        transform: translateY(0);
        transition-delay: 0.15s;
      }

      /* Hero Glow */
      @keyframes hero-glow {
        0% { box-shadow: 0 0 40px -20px hsl(var(--accent)); }
        50% { box-shadow: 0 0 60px 0px hsl(var(--accent)); }
        100% { box-shadow: 0 0 40px -20px hsl(var(--accent)); }
      }
      .hero-glow-animation { animation: hero-glow 8s ease-in-out infinite; }

      /* Professional Button Glow */
      .btn-primary-glow {
        box-shadow: 0 4px 15px -5px hsl(var(--accent) / 0.4);
        transition: all 0.3s ease;
      }
      .btn-primary-glow:hover {
          transform: translateY(-2px);
          box-shadow: 0 6px 20px -4px hsl(var(--accent) / 0.5);
      }
      
      /* Card Hover Glow */
      .card-glow-on-hover {
        transition: box-shadow 0.3s ease, transform 0.3s ease;
      }
      .card-glow-on-hover:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 25px -5px hsl(var(--accent) / 0.1), 0 4px 10px -6px hsl(var(--accent) / 0.1);
      }

      /* Print Styles for Invoices */
      @media print {
        @page {
          size: letter;
          margin: 0;
        }
        body {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        body * { visibility: hidden; }
        .print-area, .print-area * { visibility: visible; }
        .print-area { position: absolute; left: 0; top: 0; width: 100%; height: auto; padding: 0; margin: 0; }
        .dark .print-area {
           --background: 0 0% 100%; --foreground: 222.2 84% 4.9%;
           --card: 0 0% 100%; --card-foreground: 222.2 84% 4.9%;
           --muted: 210 40% 96.1%; --muted-foreground: 215.4 16.3% 46.9%;
           --border: 214.3 31.8% 91.4%;
           color: hsl(var(--foreground)); background-color: hsl(var(--background));
        }
      }
      
      /* Interactive Demo Styles */
      @keyframes demo-bubble-in {
        from { opacity: 0; transform: translateY(10px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .demo-bubble {
        animation: demo-bubble-in 0.4s ease-out forwards;
      }
      
      @keyframes demo-typing-dot {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1.0); }
      }
      .demo-typing-dot {
        animation: demo-typing-dot 1.4s infinite ease-in-out both;
      }
      
      @keyframes demo-tooltip-in {
        from { opacity: 0; transform: translateY(5px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .demo-tooltip {
        animation: demo-tooltip-in 0.3s ease-out forwards;
      }

      /* New Workflow Demo Styles */
      @keyframes demo-panel-in {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .demo-workflow-panel {
        animation: demo-panel-in 0.5s ease-out forwards;
      }
      
      @keyframes demo-node-active-glow {
        0% { box-shadow: 0 0 0 0px hsl(var(--accent) / 0.5); background-color: hsl(var(--muted)); }
        50% { box-shadow: 0 0 8px 3px hsl(var(--accent) / 0.4); background-color: hsla(var(--accent), 0.2); }
        100% { box-shadow: 0 0 0 0px hsl(var(--accent) / 0.5); background-color: hsl(var(--muted));}
      }
      .demo-node-active {
        animation: demo-node-active-glow 1.2s ease-in-out;
      }

    </style>

    <script>
      // Apply theme before page load to prevent FOUC
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
